[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "quotes-checker"
version = "1.0.0"
description = "Check whether CSV columns are written with quotes"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["."]
include = ["quotes_checker*"]
